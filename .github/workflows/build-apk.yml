name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependencias y preparar proyecto Android
        run: |
          npm install
          if [ ! -f android/gradlew ]; then
            mv android android-overrides
            npx cap add android
            cp -r android-overrides/. android/
            rm -rf android-overrides
          fi
          npx cap sync android
      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Editor_Avanzado_M_vil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
